name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Fetch android.jar
        run: cp "$ANDROID_HOME/platforms/android-34/android.jar" ./android.jar

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build
        run: |
          export D8_JAR="$ANDROID_HOME/build-tools/34.0.0/lib/d8.jar"
          bash build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DYParse-apk
          path: build/DYParse.apk
